services:
  pocketbase:
    build:
      context: .
      dockerfile: docker/pocketbase/Dockerfile
    restart: unless-stopped
    volumes:
      - ./pb_data:/pb/pb_data
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
    ports:
      - '8090:8090'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_URL: 'http://pocketbase:8090'
      PORT: '3000'
      HOST: '0.0.0.0'
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    ports:
      - '3000:3000'
