name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well: new vulnerabilities and broken upstreams show up
  # without a commit.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run check
      - run: bun run build

  # The iOS app's Dart: format, analysis and unit tests. Tests use the
  # runner's libsqlite3 (hooks.user_defines in app/pubspec.yaml).
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
      - run: sudo apt-get install -yq libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [frontend, pocketbase]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.name }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The supply chain: vulnerable npm packages, risky workflow patterns,
  # secrets in the history.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # osv-scanner 2.6 needs it; only the tool runs here
      - name: osv-scanner (bun.lock, app/pubspec.lock)
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source -L bun.lock -L app/pubspec.lock
      - name: zizmor (workflows)
        run: pipx run zizmor==1.30.1 --format=github .github/workflows
      - name: gitleaks (history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --no-banner -c /repo/.gitleaks.toml

  # Static analysis with semgrep's default rules. Excluded after a look at
  # each finding (2026-10-13):
  #   missing-user, missing-user-entrypoint: PocketBase runs as root on a
  #     volume root owns (the pod drops all capabilities); the frontend
  #     image has a USER;
  #   prototype-pollution-loop: t() only reads translation keys from code;
  #   react-insecure-request: start.ts polls the local dev PocketBase.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          pipx run semgrep==1.180.0 scan --config p/default --metrics=off --error
          --exclude-rule dockerfile.security.missing-user.missing-user
          --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint
          --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop
          --exclude-rule typescript.react.security.react-insecure-request.react-insecure-request
