apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketbase
  namespace: schwingen
  labels:
    app: pocketbase
spec:
  replicas: 1
  # Recreate (not RollingUpdate) because PVC is ReadWriteOnce
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketbase
  template:
    metadata:
      labels:
        app: pocketbase
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/api/metrics"
    spec:
      containers:
        - name: pocketbase
          image: ghcr.io/OWNER/schwingen-pocketbase:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PB_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: schwingen-secret
                  key: PB_ENCRYPTION_KEY
          volumeMounts:
            - name: pb-data
              mountPath: /pb/pb_data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
      volumes:
        - name: pb-data
          persistentVolumeClaim:
            claimName: pocketbase-data
