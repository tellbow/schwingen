apiVersion: v1
kind: Service
metadata:
  name: metrics-blackhole
  namespace: schwingen
  # Intentionally has no selector, so it has no Endpoints and nginx returns
  # 503 for any request routed to it. Used to keep /metrics unreachable
  # from the public ingress while ServiceMonitor still scrapes it directly
  # via the frontend Service (a separate, cluster-internal network path).
spec:
  ports:
    - port: 80
